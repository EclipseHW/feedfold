# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Echovale"

[setup]
script = '''
npm ci
npm_config_ignore_scripts=false npm rebuild better-sqlite3
node .codex/scripts/dev-server.mjs start --open
'''

[setup.darwin]
script = '''
fnm exec --using=.node-version npm ci
npm_config_ignore_scripts=false fnm exec --using=.node-version npm rebuild better-sqlite3
COMMON_GIT_DIR="$(git rev-parse --path-format=absolute --git-common-dir)"
SHARED_DB="$COMMON_GIT_DIR/codex/echovale.db"
SOURCE_DB="$(dirname "$COMMON_GIT_DIR")/data/echovale.db"
mkdir -p "$(dirname "$SHARED_DB")"
if [ ! -f "$SHARED_DB" ] && [ -f "$SOURCE_DB" ]; then
  fnm exec --using=.node-version node --input-type=module -e 'import Database from "better-sqlite3"; const [, sourcePath, targetPath] = process.argv; const source = new Database(sourcePath, { readonly: true }); await source.backup(targetPath); source.close();' "$SOURCE_DB" "$SHARED_DB"
fi
if [ -x ./node_modules/.bin/playwright ]; then
  fnm exec --using=.node-version ./node_modules/.bin/playwright install chromium
fi
fnm exec --using=.node-version node .codex/scripts/dev-server.mjs start --open
'''

[cleanup]
script = "node .codex/scripts/dev-server.mjs stop"

[cleanup.darwin]
script = "fnm exec --using=.node-version node .codex/scripts/dev-server.mjs stop"

[[actions]]
name = "Restart dev server"
icon = "run"
platform = "darwin"
command = "fnm exec --using=.node-version node .codex/scripts/dev-server.mjs restart --open"

[[actions]]
name = "Check"
icon = "test"
platform = "darwin"
command = "fnm exec --using=.node-version npm run check"
