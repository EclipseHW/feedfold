version = 1
name = "Feedfold"

[setup]
script = '''
ln -sfn "$CODEX_SOURCE_TREE_PATH/node_modules" node_modules
node .codex/scripts/dev-server.mjs start
'''

[setup.darwin]
script = '''
ln -sfn "$CODEX_SOURCE_TREE_PATH/node_modules" node_modules
fnm exec --using=.node-version node .codex/scripts/dev-server.mjs start
'''

[cleanup]
script = "node .codex/scripts/dev-server.mjs stop"

[cleanup.darwin]
script = "fnm exec --using=.node-version node .codex/scripts/dev-server.mjs stop"

[[actions]]
